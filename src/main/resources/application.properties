```properties
spring.application.name=smartbook
server.port=8080

# ==============================
# PostgreSQL
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/smartbank
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==============================
# Kafka
# ==============================

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=smartbank-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartbook


# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:SmartBookJwtSecretKeyForLocalDevelopment2026VeryLongRandomKey123456}
```
